<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virais do Momento</title>
  <meta name="description" content="Os vídeos que estão viralizando no YouTube nos últimos 15 dias, com um resumo de cada um." />
  <style>
    :root {
      --bg: #f6f6f8; --surface: #ffffff; --text: #16161a; --muted: #6b6b76; --border: #e4e4ea;
      --accent: #ff3d6e; --yt: #ff0033; --tt: #00b8b0; --ig: #d62976;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e12; --surface: #18181f; --text: #f1f1f4; --muted: #9a9aa6; --border: #2a2a34;
              --shadow: 0 1px 2px rgba(0,0,0,.4); }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); margin: 6px 0 0; }
    .toolbar { z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
               backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .toolbar-in { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px;
                  flex-wrap: wrap; align-items: center; justify-content: space-between; }
    @media (min-width: 700px) { .toolbar { position: sticky; top: 0; } }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 14px;
           border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
    .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tab .count { font-weight: 500; opacity: .6; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--surface); color: var(--text); }
    main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 48px; }
    .notice { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
              padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
    .notice:empty { display: none; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
            box-shadow: var(--shadow); display: flex; flex-direction: column; text-decoration: none; color: inherit;
            transition: transform .15s ease; }
    .card:hover { transform: translateY(-2px); }
    .thumb { position: relative; aspect-ratio: 16/10; background: var(--border); overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rank { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.72); color: #fff; font-weight: 700;
            border-radius: 8px; padding: 2px 8px; font-size: 13px; }
    .badge { position: absolute; top: 8px; right: 8px; color: #fff; font-weight: 700; font-size: 12px;
             border-radius: 999px; padding: 3px 9px; }
    .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .summary { margin: 0; font-size: 14px; color: var(--text); opacity: .85; }
    .summary span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
                    color: var(--muted); margin-bottom: 2px; }
    .title { font-weight: 600; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
    .meta .author { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats { display: flex; gap: 12px; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: auto; flex-wrap: wrap; }
    .stats b { font-weight: 700; }
    .heat { height: 4px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .heat i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, var(--accent)); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 60px 0; }
    footer { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px 32px; }
  </style>
</head>
<body>
  <header>
    <h1>Virais do <span>Momento</span> 🔥</h1>
    <p class="sub" id="sub">O que está bombando nos últimos 15 dias.</p>
  </header>

  <div class="toolbar">
    <div class="toolbar-in">
      <div class="tabs" id="tabs" role="group" aria-label="Plataforma"></div>
      <label>Ordenar por
        <select id="sort">
          <option value="score">🔥 Mais viral (velocidade)</option>
          <option value="views">Mais visualizações</option>
          <option value="likes">Mais curtidas</option>
          <option value="comments">Mais comentários</option>
          <option value="publishedAt">Mais recentes</option>
        </select>
      </label>
    </div>
  </div>

  <main>
    <div class="notice" id="notice"></div>
    <div class="grid" id="grid"><div class="loading">Carregando virais…</div></div>
  </main>

  <footer id="footer"></footer>

  <script>
    const PLAT = {
      all: { label: "Todos" },
      youtube: { label: "YouTube", color: "var(--yt)" },
      tiktok: { label: "TikTok", color: "var(--tt)" },
      instagram: { label: "Instagram", color: "var(--ig)" },
    };
    const state = { tab: "all", sort: "score", data: null };

    const fmt = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
    const rtf = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
    function ago(iso) {
      const h = (Date.now() - new Date(iso)) / 36e5;
      return h < 24 ? rtf.format(-Math.round(h), "hour") : rtf.format(-Math.round(h / 24), "day");
    }
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = (u) => (/^https:\/\//.test(u || "") ? u : "#");

    // Abrir no aplicativo em vez do site:
    // - Android: link "intent://" com o pacote do app; se o app não estiver
    //   instalado, o Chrome abre o link normal (browser_fallback_url).
    // - iPhone: o link https normal, na mesma aba. Ao tocar nele no Safari,
    //   o iOS entrega para o app instalado (Universal Links).
    // - Computador: link normal em nova aba.
    const ANDROID_PKG = { youtube: "com.google.android.youtube", tiktok: "com.zhiliaoapp.musically", instagram: "com.instagram.android" };
    const UA = navigator.userAgent;
    const IS_ANDROID = /Android/i.test(UA);
    const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    function openLink(item) {
      const url = safeUrl(item.url);
      if (url === "#") return { href: url, attrs: "" };
      if (IS_ANDROID && ANDROID_PKG[item.platform]) {
        const intent = `intent://${url.replace(/^https:\/\//, "")}#Intent;scheme=https;package=${ANDROID_PKG[item.platform]};` +
          `S.browser_fallback_url=${encodeURIComponent(url)};end`;
        return { href: intent, attrs: "" };
      }
      if (IS_IOS) return { href: url, attrs: "" };
      return { href: url, attrs: 'target="_blank" rel="noopener noreferrer"' };
    }

    function allItems() {
      return (state.data?.platforms || []).flatMap((p) => p.items);
    }

    function renderTabs() {
      const counts = { all: allItems().length };
      const shown = (state.data?.platforms || []).map((p) => p.platform);
      for (const p of state.data?.platforms || []) counts[p.platform] = p.items.length;
      // Com uma plataforma só (padrão: YouTube), as abas não fazem sentido
      const tabs = document.getElementById("tabs");
      tabs.hidden = shown.length < 2;
      tabs.innerHTML = Object.entries(PLAT).filter(([k]) => k === "all" || shown.includes(k)).map(([k, v]) => `
        <button class="tab" data-tab="${k}" aria-pressed="${state.tab === k}">
          ${v.color ? `<span class="dot" style="background:${v.color}"></span>` : ""}
          ${v.label} <span class="count">${counts[k] ?? 0}</span>
        </button>`).join("");
    }

    function renderNotice() {
      const msgs = [];
      for (const p of state.data?.platforms || []) {
        const name = PLAT[p.platform].label;
        if (p.demo) msgs.push(`<b>${name}</b>: dados de demonstração (${esc(p.note)}).`);
        else if (p.error) msgs.push(`<b>${name}</b>: erro ao buscar${p.stale ? " — mostrando última versão salva" : ""}.`);
      }
      document.getElementById("notice").innerHTML = msgs.join("<br>");
    }

    function renderGrid() {
      let items = state.tab === "all" ? allItems() : allItems().filter((i) => i.platform === state.tab);
      const key = state.sort;
      items = [...items].sort((a, b) => key === "publishedAt" ? new Date(b.publishedAt) - new Date(a.publishedAt) : b[key] - a[key]);
      const max = Math.max(1, ...items.map((i) => i.score));
      const grid = document.getElementById("grid");
      if (!items.length) { grid.innerHTML = `<div class="empty">Nada por aqui ainda.</div>`; return; }
      grid.innerHTML = items.map((i, idx) => { const link = openLink(i); return `
        <a class="card" href="${esc(link.href)}" ${link.attrs}>
          <div class="thumb">
            ${i.thumbnail ? `<img src="${esc(safeUrl(i.thumbnail))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
            <span class="rank">#${idx + 1}</span>
            <span class="badge" style="background:${PLAT[i.platform].color}">${PLAT[i.platform].label}</span>
          </div>
          <div class="body">
            <p class="title">${esc(i.title) || "<i>(sem legenda)</i>"}</p>
            ${i.summary ? `<p class="summary"><span>Sobre o vídeo</span>${esc(i.summary)}</p>` : ""}
            <div class="meta"><span class="author">${esc(i.author)}</span><span>${ago(i.publishedAt)}</span></div>
            <div class="heat" title="Velocidade viral"><i style="width:${Math.max(4, (i.score / max) * 100)}%"></i></div>
            <div class="stats">
              ${i.views ? `<span>👁 <b>${fmt.format(i.views)}</b></span>` : ""}
              ${i.likes ? `<span>❤️ <b>${fmt.format(i.likes)}</b></span>` : ""}
              ${i.comments ? `<span>💬 <b>${fmt.format(i.comments)}</b></span>` : ""}
              ${i.shares ? `<span>↗ <b>${fmt.format(i.shares)}</b></span>` : ""}
            </div>
          </div>
        </a>`; }).join("");
    }

    function render() { renderTabs(); renderNotice(); renderGrid(); }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]"); if (!b) return;
      state.tab = b.dataset.tab; render();
    });
    document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderGrid(); });

    fetch("/api/virais")
      .then((r) => r.json())
      .then((data) => {
        state.data = data;
        document.getElementById("sub").textContent =
          `O que está bombando no ${data.platforms.map((p) => PLAT[p.platform].label).join(", ").replace(/, ([^,]*)$/, " e $1")} nos últimos ${data.windowDays} dias.`;
        document.getElementById("footer").textContent =
          `"Mais viral" = engajamento por hora desde a publicação. Atualizado ${new Date(data.generatedAt).toLocaleString("pt-BR")}.`;
        render();
      })
      .catch(() => { document.getElementById("grid").innerHTML = `<div class="empty">Não foi possível carregar os dados.</div>`; });
  </script>
</body>
</html>
